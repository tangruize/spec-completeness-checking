[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spec-determinism-tool"
version = "0.3.0"
description = "Modular specification determinism analysis with optional proof assistance"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
verus = [
    "tree-sitter==0.25.2",
    "tree-sitter-verus @ git+https://github.com/q5438722/tree-sitter-verus.git@8639c4e4196ce36dd8a40c57fbad6200735bd2d1",
    "z3-solver>=4.12.5",
]

[project.scripts]
specdet = "specdet.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["specdet*"]
