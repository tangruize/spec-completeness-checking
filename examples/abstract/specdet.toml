schema_version = 1

[project]
root = "."

[language]
name = "verus"

[targets]
include = ["contracts.rs"]
visibility = "public"

[build]
adapter = "verus.single_file"

[analysis]
kind = "abstract_determinism"
observation_policy = "verus-observable-v1"

[analysis.abstract]
require_concrete = true

[limits]
verifier_timeout_seconds = 30
solver_timeout_ms = 1000
max_search_rounds = 12
seed = 0

[artifacts]
output_dir = "./specdet-results"

[assistance]
mode = "off"

